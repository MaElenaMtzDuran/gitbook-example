name: Build y despliegue de GitBook

on:
  push:
    branches: [ main ]
  workflow_dispatch: {}

permissions:
  contents: write
  pages: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Clonar repositorio
        uses: actions/checkout@v4

      - name: Configurar Node.js (versión compatible con gitbook-cli)
        uses: actions/setup-node@v4
        with:
          node-version: '12'

      - name: Instalar gitbook-cli
        run: npm install -g gitbook-cli

      - name: Instalar Calibre (requerido para exportar EPUB)
        run: sudo apt-get update && sudo apt-get install -y calibre

      - name: Instalar complementos de GitBook
        run: gitbook install

      - name: Dar permisos de ejecución al script de build
        run: chmod +x scripts/build.sh

      - name: Generar sitio HTML, PDF y EPUB
        run: ./scripts/build.sh

      - name: Desplegar sitio HTML a GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./_book

      - name: Publicar PDF y EPUB como artefactos de la ejecución
        uses: actions/upload-artifact@v4
        with:
          name: gitbook-exports
          path: dist/
