name: Build y despliegue de GitBook

on:
  push:
    branches: [ main ]
  workflow_dispatch: {}

permissions:
  contents: write
  pages: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Clonar repositorio
        uses: actions/checkout@v4

      - name: Configurar Node.js (versión compatible con gitbook-cli)
        uses: actions/setup-node@v4
        with:
          node-version: '12'

      - name: Instalar gitbook-cli
        run: npm install -g gitbook-cli

      - name: Corregir bug conocido de graceful-fs en gitbook-cli
        # gitbook-cli (sin mantenimiento desde 2018) trae empaquetada una version
        # antigua de graceful-fs que falla con "TypeError: cb.apply is not a
        # function" en versiones modernas de Node/npm. La solucion documentada
        # por la comunidad es actualizar esa dependencia interna antes de usar
        # gitbook-cli. Ver: https://github.com/GitbookIO/gitbook-cli/issues/110
        run: |
          GITBOOK_CLI_NPM="$(npm root -g)/gitbook-cli/node_modules/npm/node_modules"
          if [ -d "$GITBOOK_CLI_NPM" ]; then
            cd "$GITBOOK_CLI_NPM"
            npm install graceful-fs@latest --save
          fi

      - name: Instalar Calibre (requerido para exportar EPUB)
        run: sudo apt-get update && sudo apt-get install -y calibre

      - name: Instalar complementos de GitBook
        run: gitbook install

      - name: Dar permisos de ejecución al script de build
        run: chmod +x scripts/build.sh

      - name: Generar sitio HTML, PDF y EPUB
        run: ./scripts/build.sh

      - name: Desplegar sitio HTML a GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./_book

      - name: Publicar PDF y EPUB como artefactos de la ejecución
        uses: actions/upload-artifact@v4
        with:
          name: gitbook-exports
          path: dist/
